<text x="54" y="956" fill="#f87171" font-size="13.2" font-weight="700">AUTOMATED BOTTLENECK INFERENCE (Ranked by Time-Share × Efficiency Headroom):</text>
<text x="54" y="980" fill="#e2e8f0" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#1 [Decode | 2. Device Global VRAM] (54% eff, 48% wt): 36B AoS block_nvfp4 breaks 16B alignment in native_down_sub8&lt;40&gt; (41% DRAM BW). -&gt; Repack NVFP4 into 128B-aligned planar SoA to unlock LDG.128 (uint4).</text>
<text x="54" y="1008" fill="#e2e8f0" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#2 [Decode | 5. Register File &amp; Occupancy] (46% eff, 32% wt): 9 micro-kernels per visit (~3–6 us each) spend ~25–32% of Decode in launch/tail drain. -&gt; Mega-fuse (ctrl_down+up+blend) &amp; (post_attn+mix_norm) + expand ...</text>
<text x="54" y="1036" fill="#e2e8f0" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#3 [Decode | 6. Warp SIMT &amp; Schedulers] (64% eff, 24% wt): 432 PRMT byte-permutes in llama.cpp-style FP4 LUT dequantization. -&gt; Replace PRMT LUT with native sm_120a `cvt.rn.f16x2.e2m1x2` (`F2FP`).</text>
<text x="36" y="1106" fill="#64748b" font-size="12">Green (&gt;=80%): Near Hardware Ceiling  •  Amber (55–79%): Tunable Headroom  •  Red (&lt;55%): Primary Bottleneck  •  Slate: Inactive</text>
