name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Run unit test suite
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI subcommands
        run: |
          nsys-heatmap --help
          nsys-heatmap render --preset commit-focus --svg /tmp/smoke_pr.svg
          nsys-heatmap render --preset prefill-vs-decode --svg /tmp/smoke_regime.svg
